<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizavo — Login test</title>
<style>
  :root { --bg:#08090d; --panel:#11131a; --line:#232736; --text:#f1f3f9; --muted:#8a90a5; --fact:#3dffa8; --fake:#ff4d7d; --twitch:#9146ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin-bottom:6px; }
  p { color:var(--muted); line-height:1.5; margin-bottom:18px; }
  button { font:inherit; font-weight:700; border:0; border-radius:12px; padding:13px 20px; cursor:pointer; }
  .twitch { background:var(--twitch); color:#fff; width:100%; font-size:16px; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); margin-top:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row span:first-child { color:var(--muted); }
  .ok { color:var(--fact); } .bad { color:var(--fake); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:14px; font-size:12px; color:var(--muted); white-space:pre-wrap; word-break:break-all; max-height:220px; overflow:auto; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Mizavo</h1>
  <p id="intro">Login test. Log in with Twitch to create your Mizavo channel.</p>

  <div id="loggedOut" class="hidden">
    <button class="twitch" id="loginBtn">Log in with Twitch</button>
  </div>

  <div id="loggedIn" class="hidden">
    <div class="row"><span>Status</span><span id="status">…</span></div>
    <div class="row"><span>Twitch name</span><span id="name">…</span></div>
    <div class="row"><span>Channel ID</span><span id="cid">…</span></div>
    <div class="row"><span>Admin</span><span id="admin">…</span></div>
    <pre id="details"></pre>
    <button class="ghost" id="logoutBtn">Log out</button>
  </div>

  <pre id="error" class="hidden"></pre>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Public project address + publishable key (safe to be in a web page; access is controlled by the database rules)
  const supabase = createClient(
    'https://puhnuwstlujkvevsromj.supabase.co',
    'sb_publishable_hu0RB8qzJWkgLMXkVh7tgg_GrV5EpA9'
  );

  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  const fail = (msg) => { $('error').textContent = msg; show('error', true); };

  $('loginBtn').onclick = async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'twitch',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) fail('Login failed: ' + error.message);
  };

  $('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };

  async function render() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { show('loggedOut', true); show('loggedIn', false); return; }

    show('loggedOut', false); show('loggedIn', true);
    $('intro').textContent = 'You are logged in. Setting up your channel…';

    const { data, error } = await supabase.rpc('ensure_my_channel');
    if (error) {
      $('status').textContent = 'Error'; $('status').className = 'bad';
      fail(error.message);
      return;
    }
    $('intro').textContent = 'Login works. Your Mizavo channel is ready.';
    $('status').textContent = 'Channel ready ✓'; $('status').className = 'ok';
    $('name').textContent = data.display_name + ' (' + data.login + ')';
    $('cid').textContent = data.channel_id;
    $('admin').textContent = data.is_admin ? 'Yes' : 'Not yet';
    $('details').textContent = JSON.stringify(data, null, 2);
  }

  supabase.auth.onAuthStateChange(() => render());
  render();
</script>
</body>
</html>
