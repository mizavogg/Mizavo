<body>
<div class="topbar">

  <nav class="siteNav" data-page="channel" aria-label="Mizavo"></nav>
</header>
</div>
<div class="wrap">

  <section class="hero">
    <span class="sticker" id="kicker">Streamer vs chat</span>
    <h1 id="title"><span class="skel skTitle" aria-hidden="true"></span><span class="vh">Loading…</span></h1>
    <p id="lede"><span class="skel skLine" aria-hidden="true"></span><span class="skel skLine short" aria-hidden="true"></span></p>
    <div class="stats hidden" id="stats"></div>
  </section>

  <section class="panel hidden" id="topBox">
    <h2><span>Top viewers</span><span class="sub" id="viewerCount"></span></h2>
    <ol class="board" id="top"></ol>
    <p class="fine">Viewers earn points by answering in this channel's chat during real games: 100 per right answer, plus a streak bonus.</p>
  </section>

  <footer class="foot"><a href="/">mizavo</a> · <a href="/today">Leaderboards</a> · <a href="/guide">Streamer guide</a> <span class="supportWrap hidden">· <a class="supportLink" target="_blank" rel="noopener noreferrer">Support Mizavo on Ko-fi</a></span> · <a href="/privacy">Privacy &amp; terms</a></footer>
</div>
