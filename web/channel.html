<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizavo — Channel</title>
<meta name="description" content="A Twitch channel's record against its chat on Mizavo, and its top viewers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/theme.css">
<link rel="stylesheet" href="/src/styles/boards.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <a class="logo" href="/">Mizavo</a>
    <div class="edition">Channel</div>
    <div class="spacer"></div>
    <a class="btn ghost small" href="/today.html">Today's board</a>
  </header>

  <section class="hero">
    <span class="sticker" id="kicker">Streamer vs chat</span>
    <h1 id="title">Loading…</h1>
    <p id="lede"></p>
    <div class="stats hidden" id="stats"></div>
  </section>

  <section class="panel hidden" id="topBox">
    <h2><span>Top viewers</span><span class="sub" id="viewerCount"></span></h2>
    <ol class="board" id="top"></ol>
    <p class="fine">Viewers earn points by answering in this channel's chat during real games: 100 per right answer, plus a streak bonus.</p>
  </section>

  <footer class="foot"><a href="/">mizavo</a> · <a href="/today.html">Today's top channels</a> · <a href="/guide.html">Streamer guide</a></footer>
</div>
<script type="module" src="/src/pages/channel.ts"></script>
</body>
</html>
